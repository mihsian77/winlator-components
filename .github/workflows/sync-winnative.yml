name: 同步 WinNative 每夜版

on:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨 3 点
  workflow_dispatch:

permissions:
  contents: write

env:
  TOKEN: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install zstandard

      - name: Install gh CLI
        run: |
          sudo apt update && sudo apt install gh -y

      - name: Run sync
        env:
          GH_TOKEN: 
        run: |
          python3 sync_components.py winnative

      - name: Commit and push
        run: |
          git config user.name "mihsian77"
          git config user.email "moon279@users.noreply.github.com"
          git add dxvk-nightly/index.txt vkd3d-nightly/index.txt
          git diff --staged --quiet || git commit -m "chore: sync WinNative nightly components"
          git push
